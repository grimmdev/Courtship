name: Release Binaries & Deploy Benchmark Pages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build Release Asset (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: court.exe
            archive: zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: court
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: court
            archive: tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Release Binary
        run: cargo build --release --bin court --target ${{ matrix.target }}

      - name: Package Windows Binary
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/court.exe dist/
          cd dist
          7z a ../court-${{ github.ref_name }}-${{ matrix.target }}.zip court.exe

      - name: Package Unix Binary
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/court dist/
          tar -czvf court-${{ github.ref_name }}-${{ matrix.target }}.tar.gz -C dist court

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: court-${{ github.ref_name }}-${{ matrix.target }}.*
          generate_release_notes: true

  deploy-pages:
    name: Deploy Benchmark Leaderboard to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Generate Benchmark HTML Dashboard
        run: |
          mkdir -p public
          cargo run -p court -- bench --suite ./suites/platformer.yaml --compare lovepilot,courtship --html-out public/index.html

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

