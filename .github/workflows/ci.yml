name: CI & Efficiency Regression Gate

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: write

jobs:
  test-and-bench:
    name: Test & Benchmark Regression Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run Test Suite (Unit, Golden, Integration)
        run: cargo test --workspace

      - name: Run All Benchmark Suites & Generate LÖVE Dashboard
        run: cargo run -p court -- bench --all --compare lovepilot,courtship --ci --max-regression 10.0 --html-out public/index.html

      - name: Run MCP Configuration & Tax Audit
        run: cargo run -p court -- doctor --ci

      - name: Deploy Benchmark Leaderboard to gh-pages Branch
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          keep_files: false
